<!doctype html>
<html lang="ko">
<title>Playoff Draft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, arena-dark ground, hardwood-orange as the single loud colour. */
:root {
  --bg: #0a0e16;
  --panel: #121926;
  --panel2: #18212f;
  --line: #263044;
  --fg: #eef2f8;
  --mute: #8592a8;
  --dim: #4a5568;
  --accent: #ff8a1f;
  --accent-ink: #1a0d00;
  --hold: #35d6ff;
  --t3: #b9c2d0;
  --t4: #a982ff;
  --t5: #ffc83d;
  --t6: #4ff0ff;
  --east: #2a5bd7;
  --east2: #173a8f;
  --west: #e04f35;
  --west2: #9c2e1c;
  --win: #ffb547;
  --f-display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --f-body: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  --f-num: 'Oswald', 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--hold); outline-offset: 2px; }
.wrap { max-width: 480px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }

/* top bar */
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar .back { justify-self: start; background: none; border: 0; color: var(--mute); padding: 8px 0; font-size: 13px; }
.bar h2 { margin: 0; font-family: var(--f-num); font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.bar .side { justify-self: end; font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 4px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.pips i.on { background: var(--accent); }

.btn { border: 0; border-radius: 10px; padding: 12px 10px; font-weight: 700; font-size: 14px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { padding: 16px; font-size: 16px; }
.btn[disabled] { opacity: .4; cursor: default; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; font-weight: 700; }

/* HERO */
.hero { text-align: center; padding: 28px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hero .kicker { font-family: var(--f-num); letter-spacing: .32em; color: var(--accent); font-size: 13px; }
.hero h1 { margin: 0; font-family: var(--f-num); font-weight: 700; font-size: clamp(44px, 14vw, 64px); line-height: .95; letter-spacing: .01em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffd08a 0%, var(--accent) 55%, #d55a00 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 4px 0 0; color: var(--mute); }
.hero svg { width: 64px; height: 64px; }

.carousel .slide { display: flex; align-items: center; gap: 12px; }
.carousel .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--panel2); display: grid; place-items: center; flex: none; }
.carousel .txt { flex: 1; min-width: 0; }
.carousel .txt b { display: block; font-size: 15px; }
.carousel .txt small { color: var(--mute); }
.carousel .num { text-align: right; font-family: var(--f-num); color: var(--accent); font-size: 16px; font-variant-numeric: tabular-nums; }
.carousel .num small { display: block; color: var(--mute); font-size: 11px; }
.progress { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 12px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #ff4fa3); }
.car-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.car-nav button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); }
.car-nav .dots { display: flex; gap: 6px; }
.car-nav .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--dim); transition: width .2s; }
.car-nav .dots i.on { width: 20px; background: var(--accent); }

.rules { display: flex; flex-direction: column; gap: 10px; }
.rules .panel b { display: block; margin-bottom: 4px; }
.rules .panel p { margin: 0; color: #c9d1de; }
.rules .panel small { color: var(--mute); display: block; margin-top: 4px; }
.hl3 { color: #4ee3a0; } .hl4 { color: var(--t4); } .hl5 { color: var(--t5); } .hl6 { color: #ff5c7a; }
footer { color: var(--dim); font-size: 11px; text-align: center; padding: 18px 0 0; line-height: 1.6; }

/* PLAYER CARD */
.board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.board > .card { grid-column: span 2; }
.board > .card:nth-child(4) { grid-column: 2 / span 2; }
.card { position: relative; border-radius: 12px; padding: 6px 6px 8px; background: var(--panel2); border: 2px solid #34405a; display: flex; flex-direction: column; gap: 4px; min-width: 0; user-select: none; transition: transform .15s, box-shadow .2s; }
.card.t4 { border-color: var(--t4); }
.card.t5 { border-color: var(--t5); }
.card.t6 { border-color: var(--t6); box-shadow: 0 0 14px rgba(79,240,255,.5); }
.card.held { box-shadow: 0 0 0 2px var(--hold), 0 0 18px rgba(53,214,255,.55); }
.card.syn { background: linear-gradient(160deg, #1c2b3a, #142030); }
.card.flip { animation: flip .45s ease; }
@keyframes flip { 0% { transform: rotateY(90deg) scale(.96); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .card.flip { animation: none; } }
.card.gold { animation: goldpop .9s ease; }
.card.gold::after { content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255,236,170,.75) 48%, transparent 66%) no-repeat; background-size: 250% 100%; animation: shine 1.4s ease .2s 2 both; }
@keyframes goldpop { 0% { transform: rotateY(90deg) scale(.9); } 55% { transform: scale(1.12); box-shadow: 0 0 40px 8px rgba(255,200,61,.9); } 100% { transform: none; } }
@keyframes shine { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.burst { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
.burst .flash { position: absolute; inset: 0; background: radial-gradient(circle at var(--x) var(--y), rgba(255,214,102,.7), rgba(255,138,31,.25) 30%, transparent 65%); animation: flash 1.2s ease-out both; }
.burst .spark { position: absolute; left: var(--x); top: var(--y); width: 8px; height: 8px; border-radius: 2px; background: var(--c); transform: translate(-50%, -50%);
  animation: spark 1.3s cubic-bezier(.15,.7,.3,1) both; }
.burst .ring { position: absolute; left: var(--x); top: var(--y); width: 20px; height: 20px; border: 3px solid var(--t5); border-radius: 50%; transform: translate(-50%, -50%); animation: ring .9s ease-out both; }
.burst .label { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: var(--f-num); font-weight: 700; font-size: 44px; letter-spacing: .06em; color: var(--t5);
  text-shadow: 0 0 18px rgba(255,170,0,.9), 0 3px 0 #6b3a00; width: min(90vw, 440px); animation: lbl 1.6s ease both; text-align: center; line-height: 1.1; }
.burst .label small { display: block; margin-top: 8px; line-height: 1.4; font-family: var(--f-body); font-size: 15px; color: var(--fg); letter-spacing: 0; text-shadow: 0 1px 6px #000; }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
@keyframes spark { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(1); opacity: 0; } }
@keyframes ring { 0% { opacity: 1; width: 20px; height: 20px; } 100% { opacity: 0; width: 360px; height: 360px; } }
@keyframes lbl { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }
@media (prefers-reduced-motion: reduce) { .card.gold, .card.gold::after, .burst .spark, .burst .ring { animation: none; } .burst .spark, .burst .ring { display: none; } }
.card.empty { border-style: dashed; border-color: var(--line); background: transparent; cursor: pointer; }
.card.empty .art { background: var(--panel) !important; color: var(--mute); font-size: 12px; font-weight: 700; text-align: center; }
.card.picking { box-shadow: 0 0 0 2px var(--accent), 0 0 16px rgba(255,138,31,.5); }
.picker-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.picker-h b { font-size: 16px; }
.picker-h small { color: var(--mute); }
input[type=search] { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; flex: 1; min-width: 0; }
.mode-tag { display: inline-flex; background: #102836; color: var(--hold); border: 1px solid #1d5068; padding: 2px 9px; border-radius: 6px; font-size: 11px; font-weight: 900; letter-spacing: .08em; }
.empty-note { color: var(--mute); text-align: center; padding: 18px 8px; }
.sty { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 900; white-space: nowrap; border: 1px solid currentColor; background: rgba(0,0,0,.25); }
.sty.st-run { color: #ff7a59; } .sty.st-paint { color: #c98bff; } .sty.st-three { color: #4fd1ff; } .sty.st-def { color: #6ee7a0; } .sty.st-hero { color: #ffc83d; } .sty.st-motion { color: #ff8ad8; }
.adv { display: inline-flex; border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 900; white-space: nowrap; }
.adv.up { background: #10351f; color: #6ee7a0; } .adv.down { background: #3a1414; color: #ff7676; } .adv.even { background: var(--panel2); color: var(--mute); }
.team .stl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 14px 0; }
.meters { display: grid; grid-template-columns: 76px 1fr 34px; gap: 6px 8px; align-items: center; font-size: 12px; }
.meters .mbar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.meters .mbar i { display: block; height: 100%; border-radius: 4px; }
.meters .ml { font-weight: 700; white-space: nowrap; }
.ml.st-run { color: #ff7a59; } .ml.st-paint { color: #c98bff; } .ml.st-three { color: #4fd1ff; } .ml.st-def { color: #6ee7a0; } .ml.st-hero { color: #ffc83d; } .ml.st-motion { color: #ff8ad8; }
.meters .mbar i.st-run { background: #ff7a59; } .meters .mbar i.st-paint { background: #c98bff; } .meters .mbar i.st-three { background: #4fd1ff; } .meters .mbar i.st-def { background: #6ee7a0; } .meters .mbar i.st-hero { background: #ffc83d; } .meters .mbar i.st-motion { background: #ff8ad8; }
.meters .v { color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-num); }
.ring { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11px; color: var(--mute); }
.plan { display: flex; flex-direction: column; gap: 8px; }
.plan .opt { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.plan .opt .sty { justify-self: start; }
.plan .opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.plan .opt small { grid-column: 1 / -1; color: var(--mute); font-size: 12px; }
.plan .opt .pct { font-family: var(--f-num); font-size: 18px; color: var(--fg); }
.card .hd { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; letter-spacing: .06em; }
.card .hd .cf { color: var(--mute); }
.card .art { position: relative; border-radius: 8px; aspect-ratio: 4/5; display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.card .art.E { background: linear-gradient(170deg, var(--east), var(--east2)); }
.card .art.W { background: linear-gradient(170deg, var(--west), var(--west2)); }
.card .art svg { width: 78%; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
.card .badges { position: absolute; top: 4px; left: 4px; display: flex; gap: 3px; flex-wrap: wrap; }
.badge { font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 4px; letter-spacing: .04em; }
.badge.new { background: var(--accent); color: var(--accent-ink); }
.badge.hold { background: var(--hold); color: #002330; }
.badge.ace { background: #ff4f7b; color: #fff; }
.card .nm { font-weight: 900; font-size: 12px; line-height: 1.2; letter-spacing: -.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.4em; overflow-wrap: anywhere; }
.card .mt { font-size: 10px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stars { font-size: 11px; white-space: nowrap; line-height: 1; display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-num); font-weight: 600; }
.stars .pips { display: inline-flex; gap: 1.5px; }
.stars .pips i { width: 5px; height: 9px; border-radius: 1px; background: #2a3346; }
.stars .pips i.f { background: currentColor; }
.stars .pips i.p { background: var(--t6); }
.stars.s6 { color: var(--t6); }
.stars.s3 { color: var(--t3); } .stars.s4 { color: var(--t4); } .stars.s5 { color: var(--t5); }
.stars .plus { color: var(--t6); font-weight: 700; font-size: 10px; }
.card.unknown .art { background: #141b27 !important; }
.card.unknown .art::after { content: "?"; font-family: var(--f-num); font-size: 28px; color: #2c3647; }
.card.unknown .nm, .card.unknown .mt, .card.unknown .stars { color: var(--dim); }

.score-h { display: flex; justify-content: space-between; align-items: end; }
.score-h .big { font-family: var(--f-display); font-size: 24px; }
.score-h .big b { color: var(--accent); font-family: var(--f-num); font-size: 26px; margin-left: 4px; }
.score-h small { color: var(--mute); font-size: 11px; }

.syn h3 { margin: 0 0 4px; font-size: 18px; font-family: var(--f-num); letter-spacing: .04em; }
.syn h3.legend { color: var(--t5); }
.syn h3.part { color: #4ee3a0; }
.syn p { margin: 0 0 6px; color: #c9d1de; }
.syn .hint { color: var(--hold); font-size: 13px; }
.syn .hint b { color: var(--t5); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; font-size: 12px; color: #c9d1de; font-variant-numeric: tabular-nums; }
.chip.on { border-color: #4ee3a0; color: #4ee3a0; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); transform: translateX(-50%); z-index: 50; background: #241a0b; border: 1px solid var(--accent); color: var(--fg); padding: 6px 12px 6px 6px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.5); animation: drop .3s ease; max-width: calc(100vw - 32px); }
.toast .tag { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 900; letter-spacing: .06em; white-space: nowrap; }
.toast.ach { background: #1d1430; border-color: var(--t4); }
.toast.ach .tag { background: var(--t4); color: #160a33; }
@keyframes drop { from { transform: translate(-50%, -20px); opacity: 0; } }

/* roster rows (tournament) */
.team { border-radius: 14px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; }
.team.me { border-color: var(--accent); }
.team .head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: linear-gradient(120deg, var(--panel2), var(--panel)); }
.team .head .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.team .head .ttl { flex: 1; min-width: 0; }
.team .head .ttl small { color: var(--accent); font-size: 11px; font-weight: 900; letter-spacing: .1em; display: block; }
.team .head .ttl b { font-family: var(--f-num); font-size: 20px; letter-spacing: .02em; display: block; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team .head .sc { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; background: var(--bg); }
.team .head .sc small { font-size: 9px; color: var(--mute); display: block; letter-spacing: .1em; }
.team .head .sc b { font-family: var(--f-num); font-size: 20px; color: var(--accent); }
.team ul { list-style: none; margin: 0; padding: 4px 14px 10px; }
.team li { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; padding: 5px 0; border-bottom: 1px solid #1c2534; align-items: center; font-size: 13px; }
.team li:last-child { border-bottom: 0; }
.team li .p { color: var(--mute); font-size: 11px; font-weight: 700; }
.team li .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.series { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px; }
.series .lbl { font-size: 11px; color: var(--mute); letter-spacing: .2em; }
.series b { font-family: var(--f-num); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.series b.lead { color: var(--accent); }
.games { display: flex; flex-direction: column; gap: 6px; }
.game { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 12px; animation: drop .25s ease; }
.game.opp { border-left-color: var(--hold); }
.game .g { background: var(--panel2); border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 900; color: var(--mute); white-space: nowrap; }
.game .w { font-weight: 900; color: var(--accent); white-space: nowrap; }
.game.opp .w { color: var(--hold); }
.game .d { color: #c9d1de; min-width: 0; }
.result { text-align: center; border: 1px solid var(--accent); background: linear-gradient(160deg, #2a1a07, #161009); }
.result.lost { border-color: var(--line); background: var(--panel); }
.result h3 { margin: 0; font-family: var(--f-display); font-size: 24px; color: var(--t5); }
.result.lost h3 { color: var(--mute); }
.result p { margin: 4px 0 0; color: #c9d1de; }
.stage-tag { display: inline-flex; background: #2a1d08; color: var(--t5); border: 1px solid #5a3d0e; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }

.bracket h4 { margin: 12px 0 6px; font-size: 13px; color: var(--mute); }
.bracket h4.fin { color: var(--accent); }
.match { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 6px; }
.match.mine { border-color: var(--accent); }
.match div { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.match div + div { border-top: 1px solid #1c2534; }
.match .w { font-weight: 900; }
.match .l { color: var(--mute); }
.match .tbd { color: var(--dim); }
.match .me { color: var(--accent); }

/* filters & grids */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; }
.seg { display: inline-flex; background: var(--panel2); border-radius: 8px; padding: 3px; border: 1px solid var(--line); }
.seg button { background: none; border: 0; padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--mute); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 900; }
.count { margin-left: auto; color: var(--mute); font-size: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.more { text-align: center; }

.gcard { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }

/* ---------- helpers ---------- */
const $app = document.getElementById('app');

}
function cardHtml(i, o = {}) {

/* ---------- team styles & counters ---------- */
const STY = {
  run: { n: '런앤건', d: '빠른 템포와 속공' },
  paint: { n: '페인트 지배', d: '골밑 득점·자유투·공격 리바운드' },
  three: { n: '3점 폭격', d: '높은 3점 시도 비율' },
  def: { n: '질식 수비', d: '최상위 수비 효율' },
  hero: { n: '히어로 볼', d: '에이스 한 명에게 몰린 공격' },
  motion: { n: '볼 무브먼트', d: '어시스트 비율이 높은 패스 농구' }
};
const RING = ['run', 'paint', 'three', 'def', 'hero', 'motion']; // each beats the next one
const WHY = {
  run: '느린 빅맨들이 속공 템포를 따라가지 못합니다',
  paint: '작은 슈터 라인업이 골밑과 리바운드 싸움에서 밀립니다',
  three: '넓은 스페이싱이 하프코트 수비를 늘려 놓습니다',
  def: '에이스 한 명에게 수비를 몰아 봉쇄합니다',
  hero: '해결사의 1대1이 접전 막판을 가져갑니다',
  motion: '참을성 있는 패스가 속공 팀의 실수를 끌어냅니다'
};
const COUNTER = 8; // team-score points the favoured side gains
const beats = (a, b) => RING[(RING.indexOf(a) + 1) % RING.length] === b;
function advOf(a, b) { return beats(a, b) ? 1 : beats(b, a) ? -1 : 0; }
function styChip(k) { return `<span class="sty st-${k}">${STY[k].n}</span>`; }
function advChip(v) { return v > 0 ? `<span class="adv up">상성 유리 +${COUNTER}</span>` : v < 0 ? `<span class="adv down">상성 불리 −${COUNTER}</span>` : '<span class="adv even">상성 보통</span>'; }
function topStyles(vec) { return Object.entries(vec).sort((a, b) => b[1] - a[1]).map(x => x[0]); }
function myVec(ids) {
  const ps = ids.map(i => D.players[i]), ts = ps.map(p => teamById[p.t]);
  const avg = k => ts.reduce((s, t) => s + t.st[k], 0) / ts.length;
  const share = Math.max(...ps.map(p => p.pts)) / (ps.reduce((s, p) => s + p.pts, 0) || 1);
  const f3 = ps.reduce((s, p) => s + (p.f3a || 0), 0);
  const z = (v, k) => (v - D.norm[k][0]) / D.norm[k][1];
  const v = { run: avg('run'), paint: avg('paint'), three: 0.5 * avg('three') + 0.5 * z(f3, 'f3'), def: avg('def'), hero: z(share, 'hero'), motion: avg('motion') };
  for (const k in v) v[k] = Math.round(v[k] * 100) / 100;
  return v;
}
function meters(vec) {
  return `<div class="meters">${RING.map(k => { const z = vec[k], w = Math.max(4, Math.min(100, 50 + z * 22)); return `<span class="ml st-${k}">${STY[k].n}</span><span class="mbar"><i class="st-${k}" style="width:${w}%"></i></span><span class="v">${z >= 0 ? '+' : ''}${z.toFixed(1)}</span>`; }).join('')}</div>`;
}
function ringHtml() { return `<div class="ring">${RING.map(k => styChip(k)).join(' › ')} › ${styChip('run')}</div>`; }
function gameWinP(A, B) { const adv = advOf(A.style, B.style); return 1 / (1 + Math.exp(-(A.score - B.score + adv * COUNTER) / 5)); }
function seriesWinP(p) { let w = 0; for (let k = 0; k < 4; k++) { const c = [1, 4, 10, 20][k]; w += c * Math.pow(p, 4) * Math.pow(1 - p, k); } return w; }

/* ---------- synergy ---------- */
function synergy(ids) {
  const ps = ids.map(i => D.players[i]), ts = ps.map(p => teamById[p.t]);
  const cnt = (arr) => arr.reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {});
  const byTeam = cnt(ps.map(p => p.t)), byFr = cnt(ts.map(t => t.a)), bySea = cnt(ts.map(t => t.y)), byConf = cnt(ts.map(t => t.c));
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0];
  const [tTeam, nTeam] = top(byTeam), [tFr, nFr] = top(byFr), [tSea, nSea] = top(bySea), [tConf, nConf] = top(byConf);
  const legend = nTeam === 5;
  // season link only counts cards from a different team in the same year
  const seaTeams = {}; ts.forEach(t => { (seaTeams[t.y] ||= new Set()).add(t.id); });
  const links = []; // [label, bonus text]
  const plus = ts.map(t => {
    let b = 0;
    const nt = byTeam[t.id], nf = byFr[t.a];
    if (nt >= 5) b += 3; else if (nt >= 3) b += 2; else if (nt >= 2) b += 1;
    else if (nf >= 5) b += 2; else if (nf >= 2) b += 1;
    if (seaTeams[t.y].size >= 2) b += 1;
    if (byConf[t.c] >= 4) b += 1;
    return b;
  });
  // describe active links (once per group)
  Object.entries(byTeam).forEach(([id, n]) => { if (n >= 2) { const t = teamById[id]; links.push([`${n === 5 ? '레전더리' : '팀메이트'} ${t.y} ${t.a} ${n}장`, `+${n >= 5 ? 3 : n >= 3 ? 2 : 1}`]); } });
  Object.entries(byFr).forEach(([a, n]) => { const sameTeam = Object.entries(byTeam).some(([id, m]) => teamById[id].a === a && m >= 2); const loose = ts.filter(t => t.a === a && byTeam[t.id] < 2).length;
    if (n >= 2 && loose) links.push([`${n === 5 ? '프레스티지' : '프랜차이즈'} ${a} ${n}장`, `+${n >= 5 ? 2 : 1}${sameTeam ? ' (팀메이트 제외 카드)' : ''}`]); });
  Object.entries(seaTeams).forEach(([y, set]) => { if (set.size >= 2) links.push([`같은 시즌 ${y} ${bySea[y]}장`, '+1']); });
  Object.entries(byConf).forEach(([c, n]) => { if (n >= 4) links.push([`${CONF[c]} ${n}장`, '+1']); });
  const items = ps.map((p, k) => Math.min(MAXS, p.s + plus[k]) - p.s);
  const bonus = items.reduce((a, b) => a + b, 0);
  const score = ps.reduce((s, p, k) => s + p.s + items[k], 0);
  const tt = teamById[tTeam];
  let title = '시너지 없음', cls = '', desc = '같은 팀·같은 프랜차이즈·같은 시즌 카드가 2장만 겹쳐도 보너스! 같은 컨퍼런스 4장 이상도 +1입니다.';
  if (legend) { title = 'LEGENDARY'; cls = 'legend'; desc = `${tt.y} ${tt.a} 완전체! 전 카드 +3성 (최대 10성)`; }
  else if (links.length) { title = `연결 ${links.length}개 · +${bonus}성`; cls = 'part'; desc = '겹치는 카드마다 보너스가 붙었습니다.'; }

  if (!links.length) chips.push([`팀: ${tt.a} ${tt.y} ${nTeam}/5`, 0, false], [`시즌: ${tSea} ${nSea}/5`, 0, false], [`컨퍼런스: ${CONF[tConf]} ${nConf}/5`, 0, false]);
  return { plus: items, score, bonus, legend, title, cls, desc, chips, target: tTeam, nTeam, nFr };
}

/* ---------- draft ---------- */
let draft = null;
function rollRarity(rates) { const r = Math.random(); return r < rates[0] ? 0 : r < rates[0] + rates[1] ? 1 : 2; }
function dealOne(slot, rates, taken) {
  const pos = SLOTS[slot];
  for (let k = 0; k < 30; k++) {
    let s = rollRarity(rates); let list = pool[pos][s];
    while (!list || !list.length) { s = s === 0 ? 2 : s - 1; list = pool[pos][s]; }
    const i = pick(list);
    if (!taken.some(j => D.players[j].n === D.players[i].n)) return i;
  }
  return pick(pool[pos][3]);
}
function collect(ids) {
  const fresh = [];
  ids.forEach(i => { if (!save.own[i]) { save.own[i] = 1; fresh.push(i); } });
  const unlocked = [];
  new Set(fresh.map(i => D.players[i].t)).forEach(tid => { if (teamOwned(teamById[tid]) === 5) unlocked.push(tid); });
  persist();
  unlocked.forEach(tid => { const t = teamById[tid]; toast('UNLOCKED', `${t.y} ${nick(t.n)} 완성`); });
  checkAch();
  return fresh;
}
function startDraft() {
  const slots = [];
  for (let s = 0; s < 5; s++) slots.push(dealOne(s, [.7, .25, .05], slots));
  const fresh = collect(slots);
  draft = { slots, held: [0, 0, 0, 0, 0], left: 3, isNew: slots.map(i => fresh.includes(i)), flip: [1, 1, 1, 1, 1], done: false };
  go('draft');
}
function rerollHint() {
  const used = 3 - draft.left; if (draft.left <= 0) return null;
  const heldIds = draft.slots.filter((_, k) => draft.held[k]);
  const base = heldIds.length ? heldIds : draft.slots;
  const c = {}; base.forEach(i => { const t = D.players[i].t; c[t] = (c[t] || 0) + 1; });
  const all = {}; draft.slots.forEach(i => { const t = D.players[i].t; all[t] = (all[t] || 0) + 1; });
  const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  if (!best || best[1] < (heldIds.length ? 1 : 2)) return null;
  const n = all[best[0]];
  if (n >= 5) return null;
  const hc = draft.slots.filter((i, k) => draft.held[k] && D.players[i].t === best[0]).length;
  const parts = [0.1 * (used + 1), 0.15 * hc, n >= 3 ? 0.15 : 0];
  const p = Math.min(0.85, parts[0] + parts[1] + parts[2]);
  return { team: best[0], p, n, hc, parts };
}
function reroll() {
  if (draft.left <= 0) return;
  const h = rerollHint();
  const slots = draft.slots.slice(), flip = [0, 0, 0, 0, 0];
  for (let s = 0; s < 5; s++) {
    if (draft.held[s]) continue;
    const others = slots.filter((_, k) => k !== s);
    let i = null;
    if (h && Math.random() < h.p) {
      const t = teamById[h.team], cand = t.p.find(j => D.players[j].p === SLOTS[s]);
      if (cand != null && !others.some(j => D.players[j].n === D.players[cand].n)) i = cand;
    }
    if (i == null) i = dealOne(s, [.7, .25, .05], others);
    slots[s] = i; flip[s] = 1;
  }
  draft.left--;
  const fresh = collect(slots.filter((_, s) => flip[s]));
  draft.isNew = slots.map((i, s) => flip[s] ? fresh.includes(i) : draft.isNew[s]);
  draft.slots = slots; draft.flip = flip;
  render();
}
function confirmDraft() {
  draft.done = true; draft.date = new Date();
  const syn = synergy(draft.slots);
  if (syn.legend) unlockAch('legend');
  if (syn.score >= 40) unlockAch('perfect');
  go('roster');
}

/* ---------- free mode ---------- */
let free = { slots: [null, null, null, null, null], pick: 0, q: '', conf: '', sort: 'star', limit: 45 };
function startFree(keep) {
  if (!keep) free.slots = [null, null, null, null, null];
  free.pick = free.slots.findIndex(x => x == null); if (free.pick < 0) free.pick = null;
  free.q = ''; free.limit = 45;
  go('free');
}

    g.fillStyle = '#8592a8'; g.font = '700 28px Oswald, sans-serif'; g.fillText(p.p, 250, y + 55);
    g.fillStyle = '#eef2f8'; g.font = '900 44px "Noto Sans KR", sans-serif'; g.fillText(p.n, 250, y + 105);
    g.fillStyle = '#8592a8'; g.font = '500 26px "Noto Sans KR", sans-serif'; g.fillText(`${t.a} · ${t.y} ${RES[t.r]} · PO ${p.pts.toFixed(1)}점`, 250, y + 145);
    const st = Math.min(MAXS, p.s + syn.plus[k]);
    g.fillStyle = st >= 10 ? '#4ff0ff' : st >= 9 ? '#ffc83d' : st >= 6 ? '#a982ff' : '#b9c2d0'; g.font = '700 44px Oswald, sans-serif'; g.textAlign = 'right'; g.fillText('★ ' + st, 990, y + 62); g.textAlign = 'left';
  });
  g.fillStyle = '#4a5568'; g.font = '500 24px "Noto Sans KR", sans-serif'; g.fillText(fmtDate(draft.date || new Date()), 70, 1300);
  return cv.toDataURL('image/png');
}
function showImage() {
  const url = rosterImage();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<img src="${url}" alt="내 로스터 이미지"><p>이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요.</p><div class="row2" style="width:100%;max-width:360px"><a class="btn" href="${url}" download="playoff-draft.png" style="text-align:center;text-decoration:none">파일로 받기</a><button class="btn primary">닫기</button></div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.tagName === 'BUTTON') m.remove(); });
  document.body.appendChild(m);
}
function shareLink() {
  const url = location.href.split('#')[0] + '#r-' + draft.slots.join('-');
  const done = () => toast('링크 복사', '공유 링크를 복사했습니다');
  try { navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url)); } catch (e) { fallbackCopy(url); }
}
function fallbackCopy(url) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<p>아래 주소를 복사해 공유하세요.</p><input id="share-url" readonly value="${esc(url)}" style="width:100%;max-width:420px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)"><button class="btn primary">닫기</button>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.tagName === 'BUTTON') m.remove(); });
  document.body.appendChild(m); const inp = m.querySelector('input'); inp.focus(); inp.select();
}
function loadHash() {
  const m = /^#r-([\d-]+)$/.exec(location.hash);
  if (!m) return false;
  const ids = m[1].split('-').map(Number);
  if (ids.length !== 5 || !ids.every((i, k) => D.players[i] && D.players[i].p === SLOTS[k])) return false;
  draft = { slots: ids, held: [0, 0, 0, 0, 0], left: 0, isNew: [0, 0, 0, 0, 0], flip: [0, 0, 0, 0, 0], done: true, shared: true, date: new Date() };
  view = 'roster'; return true;
}

/* ---------- events ---------- */
function act(a) {
  if (a === 'start') { if (location.hash) history.replaceState(null, '', location.pathname + location.search); startDraft(); }
  else if (a === 'home') go('main');
  else if (a === 'reroll') reroll();
  else if (a === 'confirm') confirmDraft();
  else if (a === 'tour') startTour();
  else if (a === 'img') showImage();
  else if (a === 'share') shareLink();
  else if (a === 'play') beginMatch();
  else if (a === 'skip') skipGames();
  else if (a === 'next') nextRound();
  else if (a === 'back-roster') go('roster');
  else if (a.startsWith('style-')) { tour.rounds[tour.stage][0][0].style = a.slice(6); render(); }
  else if (a === 'free') startFree(false);
  else if (a === 'free-edit') { free.slots = draft.slots.slice(); startFree(true); free.pick = null; render(); }
  else if (a === 'frconfirm') freeConfirm();
  else if (a === 'frreset') startFree(false);
  else if (a === 'frclear') { free.slots[free.pick] = null; render(); }
  else if (a === 'frmore') { free.limit += 45; render(); }
  else if (a.startsWith('frsort-')) { free.sort = a.slice(7); free.limit = 45; render(); }
  else if (a.startsWith('open-')) go(a.slice(5));
  else if (a.startsWith('car-')) { carIdx = (carIdx + Number(a.slice(4)) + 3) % 3; render(); }
  else if (a.startsWith('dexown-')) { dexF.own = a.slice(7); dexF.limit = 60; render(); }
  else if (a === 'dexmore') { dexF.limit += 60; render(); }
  else if (a.startsWith('galown-')) { galF.own = a.slice(7); galF.limit = 20; render(); }
  else if (a === 'galmore') { galF.limit += 20; render(); }
}
$app.addEventListener('click', e => {
  const card = e.target.closest('[data-slot]');
  if (card && view === 'draft') { const s = +card.dataset.slot; draft.held[s] = draft.held[s] ? 0 : 1; render(); return; }
  const pk = e.target.closest('[data-pick]');
  if (pk && view === 'free') {
    free.slots[free.pick] = +pk.dataset.pick;
    const nx = free.slots.findIndex(x => x == null); free.pick = nx < 0 ? null : nx; free.q = ''; free.limit = 45;
    render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  const fsl = e.target.closest('[data-fslot]');
  if (fsl && view === 'free') { const s = +fsl.dataset.fslot; free.pick = free.pick === s ? null : s; free.limit = 45; render();
    const pe = document.getElementById('picker'); if (pe && free.pick != null) pe.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act);
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-slot],[data-act],[data-fslot],[data-pick]'); if (el && el.tagName !== 'BUTTON') { e.preventDefault(); el.click(); }
});
$app.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'f-pos') dexF.pos = v; else if (id === 'f-conf') dexF.conf = v; else if (id === 'f-season') dexF.season = v;
  else if (id === 'fr-conf') { free.conf = v; free.limit = 45; render(); return; }
  else if (id === 'g-conf') galF.conf = v; else if (id === 'g-res') galF.res = v; else return;
  dexF.limit = 60; galF.limit = 20; render();
});
$app.addEventListener('input', e => {
  if (e.target.id !== 'fr-q') return;
  free.q = e.target.value; free.limit = 45;
  const pos = e.target.selectionStart; render();
  const inp = document.getElementById('fr-q'); if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (er) {} }
});
window.addEventListener('hashchange', () => { if (loadHash()) render(); });
loadHash();
render();
})();
</script>
